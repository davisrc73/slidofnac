# docker-compose.yml — Deploy Synology NAS (Produção: 4341 e Staging: 4342)
services:
  slidofnac-prod:
    container_name: slidofnac-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-4341}:4321"
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=4321
      - HOST=0.0.0.0
      - PUBLIC_BASE_URL=${PROD_PUBLIC_URL:-}
    volumes:
      - ./data/prod:/app/.slido-data

  slidofnac-staging:
    container_name: slidofnac-staging
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${STAGING_PORT:-4342}:4321"
    environment:
      - NODE_ENV=production
      - APP_ENV=staging
      - PORT=4321
      - HOST=0.0.0.0
      - PUBLIC_BASE_URL=${STAGING_PUBLIC_URL:-}
    volumes:
      - ./data/staging:/app/.slido-data
